# Paste this into Container Station: Applications > Create.
services:
  wijnkoop:
    image: ghcr.io/jaythesmay/wijnkoop:latest
    container_name: wijnkoop
    restart: unless-stopped
    # WijnKoop never takes the whole NAS: at most 2 processor cores and 1.5 GB of memory,
    # whatever it is doing. Lower them if the NAS has little to spare.
    cpus: "2.0"
    mem_limit: 1536m
    ports:
      - "8001:8001"
    volumes:
      - /share/wijnkoop:/data
    environment:
      TZ: Europe/Amsterdam
      WIJNKOOP_RUN_WEEKDAY: "0"   # 0 = Monday
      WIJNKOOP_RUN_HOUR: "1"      # 01:00 at night
