title: WijnKoop
source: "App version __BUILD_DATE__"
source_url: "https://github.com/jaythesmay/wijnkoop/commit/__GIT_SHA__"
description_html: |-
  <p><strong>App version: __BUILD_DATE__</strong> (code __GIT_SHORT__)</p>
  <p>Your private wine finder. Good places to start:</p>
  <ul>
    <li><a href="/wijnkoop/weekly_overview">Weekly overview</a>: what changed in the last 7 days (read it on Wednesdays)</li>
    <li><a href="/wijnkoop/best_buys">Best buys</a>: every wine with its score, value and price for 6 bottles</li>
    <li><a href="/wijnkoop/best_for_budget">Best wine for my budget</a></li>
    <li><a href="/wijnkoop/deals_with_awards">Deals on award-winning wines</a></li>
    <li><a href="/wijnkoop/award_list">Awards</a>: click an award on the left to see its own ranking</li>
    <li><a href="/wijnkoop/consistent_producers">Producers that win every year</a></li>
    <li><a href="/wijnkoop/wine_list">All wines</a>, <a href="/wijnkoop/matches_to_check">award matches to check</a>
      and the <a href="/wijnkoop/run_log">update log</a></li>
  </ul>
  <p><small>Score: awards and critics combined (silver and up count; Decanter, IWC and IWSC weigh most).
  Value: how much higher the score is than usual for wines at this price. Deal: at least 15% below
  the usual price, counted for an order of 6 bottles.</small></p>
databases:
  wijnkoop:
    tables:
      best_buys:
        title: Best buys
        description: >-
          One line per wine per shop. Score = combined award score (empty when no silver-or-better
          award is known). Price as 93 = what the wine would cost as a 93 with your rule per point (lower is better);
          cheaper_than_pct = how many award wines in all shops are dearer on that measure.
          Prices are per bottle when you buy 6, with the shop's promotion applied.
        sort: price_as_93
        facets:
          - colour
          - country
          - deal
          - shop
          - online_in_stock
        columns:
          price_per_bottle_at_6: Price per bottle when you buy 6 of this wine, promotion included
          price_6_bottles_incl_delivery: Total for 6 bottles including delivery costs
          normal_price: The shop's normal price for one bottle
          score: Combined award score on a 100-point scale
          value: Points more (+) or fewer (-) than the median award wine gives for the same money
          price_as_93: What this wine would cost as a 93, with your rule per point (lower is better)
          cheaper_than_pct: Share of award wines in all shops that cost more as a 93
          nothing_better_for_less: No other wine of this colour, in stock, scores higher for the same money or less
          fair_price: For information only - the usual price for this score in your shops (fitted line)
          other_vintages_awarded: How many other vintages of this wine won silver or better
          other_vintages_avg: Average score of those other vintages
          producer_wines_awarded: How many other wines of this producer won silver or better
          producer_avg: Average score of those wines
      award_list:
        title: Awards
        description: Every award and critic score linked to a wine. Click an award under the facets to see one competition's own ranking.
        sort_desc: points
        facets:
          - award
          - kind
          - medal
          - year
          - colour
      wine_list:
        title: All wines
        description: All wines with their current price per shop. Click a column to sort, use the filters to narrow down.
        sort: price_per_75cl
        facets:
          - colour
          - country
          - shop
          - online_in_stock
          - gone
        columns:
          price: Price in euro for the bottle as sold
          price_per_75cl: Price converted to a 75 cl bottle
          effective_price_per_75cl: Price per 75 cl when you buy 6, promotion included
          was_price: Struck-through earlier price shown by the shop
          awards_count: Number of awards the shop mentions
          gone: The wine is no longer on the shop's website
      weekly_events:
        title: All changes
        sort_desc: happened_on
        facets:
          - kind
          - shop
      run_log:
        title: Update log
        sort_desc: started
    queries:
      weekly_overview:
        title: Weekly overview
        description: >-
          What changed in the last 7 days, most interesting first: new awards, deals on wines
          with a score, price drops, new wines and wines that disappeared.
        sql: |-
          SELECT
            CASE e.kind
              WHEN 'new_award' THEN '1. New award'
              WHEN 'promotion_start' THEN '2. New promotion'
              WHEN 'price_drop' THEN '3. Price drop'
              WHEN 'new_offer' THEN '4. New in shop'
              WHEN 'back' THEN '4. Back in shop'
              WHEN 'back_in_stock' THEN '5. Back in stock'
              WHEN 'vintage_change' THEN '6. New vintage'
              WHEN 'price_rise' THEN '7. Price rise'
              WHEN 'promotion_end' THEN '7. Promotion ended'
              WHEN 'out_of_stock' THEN '8. Out of stock'
              WHEN 'gone' THEN '8. Gone from shop'
              ELSE e.kind END AS what,
            e.wine, e.vintage, e.shop, e.old_value AS was, e.new_value AS now, e.score,
            os.price_per_bottle_at_6, os.deal, os.value, e.happened_on, e.url
          FROM weekly_events e
          LEFT JOIN best_buys os ON os.url = e.url
          WHERE e.happened_on >= date('now', 'localtime', '-7 days')
          ORDER BY what, e.score DESC NULLS LAST, os.value DESC NULLS LAST
          LIMIT 500
      best_for_budget:
        title: Best wine for my budget
        description: >-
          Fill in your maximum price per bottle (for an order of 6) and optionally a colour
          (red, white or rosé), then press Run SQL.
        sql: |-
          SELECT wine, vintage, colour, country, shop, price_per_bottle_at_6, promotion, deal,
                 score, best_award, value, other_vintages_avg, producer_avg, online_in_stock, url
          FROM best_buys
          WHERE price_per_bottle_at_6 <= CAST(:max_price AS REAL)
            AND (:colour = '' OR colour = :colour)
            AND score IS NOT NULL
          ORDER BY score DESC, value DESC
          LIMIT 200
      deals_with_awards:
        title: Deals on award-winning wines
        sql: |-
          SELECT wine, vintage, colour, country, shop, price_per_bottle_at_6, normal_price, promotion,
                 deal_reason, score, best_award, value, online_in_stock, url
          FROM best_buys
          WHERE deal = 'yes' AND score IS NOT NULL
          ORDER BY value DESC
      consistent_producers:
        title: Producers that win every year
        description: >-
          Producers with several wines or vintages that won silver or better. Their other wines are worth a look
          even without an award of their own.
        sql: |-
          SELECT w.producer,
                 COUNT(DISTINCT ws.wine_id) AS awarded_wines_and_vintages,
                 ROUND(AVG(ws.overall), 1) AS average_score,
                 MAX(ws.overall) AS best_score,
                 (SELECT COUNT(*) FROM best_buys b WHERE b.producer = w.producer) AS wines_for_sale
          FROM wine_score ws JOIN wine w ON w.id = ws.wine_id
          WHERE ws.overall IS NOT NULL AND w.producer IS NOT NULL
          GROUP BY w.producer
          HAVING COUNT(DISTINCT ws.wine_id) >= 2
          ORDER BY average_score DESC
      matches_to_check:
        title: Award matches to check
        description: >-
          Competition results that look like a wine in the shop, but not certainly. They are not counted
          in the score. Tell Claude which ones are right or wrong and the matching gets better.
        sql: |-
          SELECT m.match_score, m.award_id, a.raw_text AS award, m.wine_id, w.name AS shop_wine, w.vintage,
                 w.producer AS shop_producer, a.source_url
          FROM award_match m JOIN award a ON a.id = m.award_id JOIN wine w ON w.id = m.wine_id
          WHERE m.confirmed IS NULL
          ORDER BY m.match_score DESC
      on_promotion:
        title: Wines on promotion now
        sql: |-
          SELECT wine, vintage, colour, country, shop, price_per_bottle_at_6, normal_price, promotion,
                 deal, score, value, url
          FROM best_buys
          WHERE promotion IS NOT NULL
          ORDER BY score DESC NULLS LAST, price_per_bottle_at_6
      price_drops:
        title: Price drops in the last 30 days
        sql: |-
          SELECT e.happened_on, e.wine, e.vintage, e.shop, e.old_value AS was, e.new_value AS now,
                 ROUND(100.0 * (e.old_value - e.new_value) / e.old_value) AS percent_off, e.score, e.url
          FROM weekly_events e
          WHERE e.kind = 'price_drop' AND e.happened_on >= date('now', 'localtime', '-30 days')
          ORDER BY percent_off DESC
