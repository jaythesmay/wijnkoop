title: WijnKoop
source: "App version __BUILD_DATE__"
source_url: "https://github.com/jaythesmay/wijnkoop/commit/__GIT_SHA__"
description_html: |-
  <p><strong>App version: __BUILD_DATE__</strong> (code __GIT_SHORT__)</p>
  Your private wine finder. Start with <a href="/wijnkoop/wine_list">the wine list</a>
  or one of the saved searches below. Phase 1: Gall &amp; Gall prices only; award scores follow in phase 2.
databases:
  wijnkoop:
    tables:
      wine_list:
        title: Wine list
        description: All wines with their current price per shop. Click a column to sort, use the filters to narrow down.
        sort: price_per_75cl
        facets:
          - colour
          - country
          - shop
          - online_in_stock
        columns:
          price: Price in euro for the bottle as sold
          price_per_75cl: Price converted to a 75 cl bottle
          awards_count: Number of awards the shop mentions (details follow in phase 2)
      run_log:
        title: Update log
        sort_desc: started
    queries:
      on_promotion:
        title: Wines on promotion now
        sql: |-
          SELECT wine, vintage, colour, country, price, promotion, awards_count, url
          FROM wine_list
          WHERE promotion IS NOT NULL
          ORDER BY awards_count DESC, price_per_75cl
      awarded_by_budget:
        title: Award-winning wines within a budget
        description: Fill in your maximum price and press Run SQL.
        sql: |-
          SELECT wine, vintage, colour, country, grapes, price, promotion, awards_count, url
          FROM wine_list
          WHERE awards_count > 0 AND price_per_75cl <= CAST(:max_price AS REAL)
          ORDER BY awards_count DESC, price_per_75cl
      price_drops:
        title: Price drops since the previous update
        sql: |-
          WITH ranked AS (
            SELECT offer_id, seen_on, price,
                   LAG(price) OVER (PARTITION BY offer_id ORDER BY seen_on) AS previous
            FROM price_history
          )
          SELECT o.title AS wine, r.previous AS was, r.price AS now,
                 ROUND(100.0 * (r.previous - r.price) / r.previous) AS percent_off, r.seen_on, o.url
          FROM ranked r JOIN offer o ON o.id = r.offer_id
          WHERE r.previous IS NOT NULL AND r.price < r.previous
            AND r.seen_on = (SELECT MAX(seen_on) FROM price_history WHERE offer_id = r.offer_id)
          ORDER BY percent_off DESC
